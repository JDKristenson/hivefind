[project]
name = "hivefind-kam"
version = "0.1.0"
description = "KAM: execution substrate for the HiveFind fleet (dispatch, hash-chained run log, boundary gate, identity kit). Spec: PRD v1.1."
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.scripts]
kam = "kam.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a live database or surface; skipped by default"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
